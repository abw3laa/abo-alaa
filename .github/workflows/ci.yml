name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest

    env:
      # قاعدة بيانات وهمية للبناء - لا تتصل فعلياً
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      AUTH_SECRET: "ci-build-secret-not-for-production-use-only"
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      AUTH_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high || true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/abo_alaa?schema=public"
      AUTH_SECRET: "ci-e2e-secret"
      AUTH_TRUST_HOST: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abo_alaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate & migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Seed
        run: npm run prisma:seed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
